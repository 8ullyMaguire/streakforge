<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="StreakForge — whiteboi denial tracker. Lock, deny, drill, waste when permitted. The board remembers who knows their place." />
		<meta name="theme-color" content="#0a0a0a" />
		<!--
			Item 07: a link to this site pasted into a chat rendered as a bare URL.
			These tags are STATIC, not per-route: the app is a client-rendered SPA,
			so a crawler that does not execute JavaScript (every chat unfurler)
			only ever sees this document. Per-route tags would be a promise the
			architecture cannot keep.
		-->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="StreakForge" />
		<meta property="og:title" content="StreakForge — Embrace Defeat. The Future Is Black." />
		<meta
			property="og:description"
			content="A whiteboi denial tracker with public boards: log the waste, log the denial, hold the streak. Activity is public; your notes are not."
		/>
		<meta property="og:url" content="https://streakforge.polarisocial.xyz/" />
		<meta property="og:image" content="https://streakforge.polarisocial.xyz/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="StreakForge — the spade mark on black." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="StreakForge — Embrace Defeat. The Future Is Black." />
		<meta
			name="twitter:description"
			content="Log the waste, log the denial, hold the streak. Public boards; private notes."
		/>
		<meta name="twitter:image" content="https://streakforge.polarisocial.xyz/og.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="StreakForge" />
		<title>StreakForge — Embrace Defeat. The Future Is Black.</title>
		%sveltekit.head%
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠️</text></svg>" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;600;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
