# CI for StreakForge (docs/100_IDEAS.md #05).
#
# Until this file existed, every gate in this repo was a thing a human had to
# remember to run. The backend suite needs a Postgres and the frontend needs a
# Node toolchain, so "just run the tests" was a five-command ritual with three
# ways to get it subtly wrong (the wrong DATABASE_URL, a stale build, a skipped
# svelte-check). This runs the whole thing on every push.
#
# Two honest notes, because a gate that overstates itself is worse than none:
#
#  * `cargo fmt --check` is ADVISORY. The tree is not rustfmt-clean (101 diffs at
#    the time of writing) and never has been; the source uses a deliberately wide
#    style with long single-line `.bind()` chains. The step is here so drift is
#    VISIBLE, and it is marked continue-on-error so a formatting preference does
#    not masquerade as a broken build.
#  * `cargo clippy` runs WITHOUT `-D warnings`, so it fails on errors and prints
#    lints for review. There are ~10 pre-existing style warnings; turning them
#    into a hard gate would mean either fixing them in a docs-only commit or
#    teaching everyone to ignore a red CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that supersedes an in-flight run makes the old one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (cargo test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The integration suite uses #[sqlx::test], which CREATES a scratch
      # database per test from this connection and drops it afterwards. So this
      # points at the maintenance database, not at a fixture schema, and the
      # role needs CREATEDB — `postgres` is a superuser and has it.
      #
      # No SESSION_SECRET here: the auth tests exercise the pure helpers
      # (password hashing, the challenge proof, the throttle arithmetic) and
      # build their own key material. Nothing in the suite starts the binary.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Formatting (advisory)
        working-directory: backend
        continue-on-error: true
        run: cargo fmt --check

      - name: Lints (errors only)
        working-directory: backend
        run: cargo clippy --all-targets

      - name: Tests
        working-directory: backend
        run: cargo test --verbose

  frontend:
    name: frontend (check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci`, not `npm install`: the lockfile is the point, and an install
      # that silently resolves a different version is how a build works here and
      # fails there.
      - run: npm ci

      # svelte-check needs the generated types, which only exist after sync.
      - name: Check
        run: npm run check

      - name: Tests
        run: npm test

      # The build is the last step on purpose: it is the slowest, and it is the
      # one that also catches a page that references a route or a module that
      # does not exist.
      - name: Build
        run: npm run build
